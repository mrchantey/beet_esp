[package]
edition      = "2024"
name         = "beet_esp"
rust-version = "1.88"
version      = "0.1.0"

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[features]
default = ["coex"]
# On-board WS2812 LED over RMT (the `led` module). No extra crates.
led = []
# Arduino Alvik robot driven over UART1 (the `alvik` module). No extra crates —
# just the always-compiled `async_bridge`. Turns on `led` for the universal
# `LedColor` component the Alvik RGB UI LEDs reuse.
alvik = ["led"]
# Wi-Fi station + embassy-net TCP/HTTP stack (the `wifi` module).
wifi = [
  "dep:esp-radio",
  "esp-radio/wifi",
  "dep:embassy-net",
  "dep:smoltcp",
  "dep:embedded-io",
  "dep:embedded-io-async",
]
# BLE host (trouBLE).
ble = ["dep:esp-radio", "esp-radio/ble", "dep:trouble-host", "dep:bt-hci"]
# SNTP wall clock (the `clock` module): a UDP NTP client that installs beet's
# `time_ext::now` source once synced. Builds on `wifi` (shares the network stack).
clock = ["wifi"]
# beet's `RandomSource` on this bare no_std target. Turns on `beet/rand` and
# provides a getrandom `custom` backend (`src/random.rs`) wired to the esp-hal
# hardware RNG; pair with the `getrandom_backend="custom"` cfg in
# `.cargo/config.toml`.
random = ["dep:getrandom", "beet/rand"]
# beet_action + the beet_async bridge (entities-as-async-functions). Pulls in
# `beet_core/bevy_async`: the AsyncWorld/AsyncEntity layer and the
# `BeetAsyncSyncPoint` driver the behavior_tree example drives. No extra esp
# crates — just turns on more of beet. Kept opt-in so non-action builds stay lean.
action = ["beet/action"]
# beet_router on this no_std target: route incoming `Request`s to per-path
# actions, served over the `wifi` HTTP server. Pulls beet's no_std router
# (`router_embedded`) plus the `action` async layer it dispatches on. See
# `examples/ecs_router.rs`.
router = ["action", "wifi", "beet/router_embedded"]
mdns = ["wifi", "action", "embassy-net/multicast", "beet/mdns"]
# rhai scripting on no_std, reached through `beet::exports::rhai`. beet's own
# `scripting` feature requires std, so the no_std engine is wired manually (see
# `src/alvik/scripting.rs`).
scripting = ["action", "beet/rhai"]
# Wi-Fi + BLE coexistence — both radios at once. Required by the default bin.
coex = ["wifi", "ble", "esp-radio/coex"]

# Examples only build when their required features are on, so e.g. `blinky`
# stays lean: `cargo run --release --no-default-features --features led --example blinky`.
[[example]]
name             = "blinky"
required-features = ["led"]

[[example]]
name             = "led_scan"
required-features = ["led"]

[[example]]
name             = "http_client"
required-features = ["wifi", "action"]

[[example]]
name             = "http_server"
required-features = ["wifi", "action"]

[[example]]
name             = "bluetooth-client"
required-features = ["ble"]

[[example]]
name             = "kitchen_sink"
required-features = ["led", "wifi", "action"]

[[example]]
name             = "behavior_tree"
required-features = ["action"]

[[example]]
name             = "ecs_router"
required-features = ["router"]

[[example]]
name             = "mdns_server"
required-features = ["mdns"]

[[example]]
name             = "mdns_browser"
required-features = ["mdns"]

[[example]]
name             = "random"
required-features = ["random"]

[[example]]
name             = "clock"
required-features = ["clock"]

# world_serde needs neither radio nor LED — core only, no required features.

# Alvik examples live in examples/alvik/ so need explicit paths. The
# behaviour-tree / observer demos additionally enable `action`.
[[example]]
name             = "alvik-codec-selftest"
path             = "examples/alvik/codec_selftest.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-blinky"
path             = "examples/alvik/blinky.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-wheels"
path             = "examples/alvik/wheels.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-drive"
path             = "examples/alvik/drive.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-servo"
path             = "examples/alvik/servo.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-sensors"
path             = "examples/alvik/sensors.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-line-follower"
path             = "examples/alvik/line_follower.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-touch-move"
path             = "examples/alvik/touch_move.rs"
required-features = ["alvik"]

[[example]]
name             = "alvik-rc"
path             = "examples/alvik/rc.rs"
required-features = ["alvik", "router"]

[[example]]
name             = "alvik-scene"
path             = "examples/alvik/scene.rs"
required-features = ["alvik", "router"]

[[example]]
name             = "scripting"
path             = "examples/scripting.rs"
required-features = ["scripting"]

[dependencies]
# Local beet worktree, no_std build exposing bevy_color etc.
beet = { path = "/home/pete/me/worktrees/beet/embedded/beet", default-features = false, features = [
  "embedded",
  "bevy_color",
  "world_serde",
  "json",
  # no_std core of beet_net: the transport-agnostic Request/Response wire types
  # and the `set_http_client` transport hook the wifi client installs.
  "net",
] }

# Sibling proc-macro crate providing #[beet_esp::main]. Builds for the host.
beet_esp_macros = { path = "macros" }

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

# Networking stack — only pulled in by the `wifi` feature (see [features]).
embassy-net = { version = "0.9.1", optional = true, features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", optional = true, features = ["defmt"] }
embedded-io-async = { version = "0.7.0", optional = true, features = ["defmt"] }
# `internal-heap-stats` adds max-usage / total-allocated / total-freed counters,
# which `health` uses for leak detection (cheap: an O(regions) tally per alloc).
esp-alloc = { version = "0.10.0", features = ["defmt", "internal-heap-stats"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
# BLE host (`bt-hci`/`trouble-host`) — only pulled in by the `ble` feature.
bt-hci = { version = "0.8.0", optional = true }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
# Radio — optional; the `wifi`/`ble`/`coex` features turn on the matching parts.
esp-radio = { version = "0.18.0", optional = true, default-features = false, features = [
  "defmt",
  "esp-alloc",
  "esp32s3",
  "unstable",
] }
smoltcp = { version = "0.13.0", optional = true, default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.6.0", optional = true, features = ["defmt", "gatt", "scan"] }

# getrandom's `custom` backend (selected in .cargo/config.toml) — only pulled in
# by the `random` feature, which provides the entropy symbol in `src/random.rs`.
getrandom = { version = "0.3", optional = true }

critical-section = "1.2.0"
embassy-futures  = "0.1.2"
# Pinned to esp-rtos's embassy-sync (0.8.0) so the bridge's Signal/Channel share
# the same version the runtime links.
embassy-sync = { version = "0.8.0", features = ["defmt"] }
static_cell  = "2.1.1"

[dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "defmt",
  "embassy-010",
  "external-executor",
  "xtensa-semihosting",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
